name: destroy-all

run-name: destroy-all on ${{ inputs.input_environment }}

on:
  workflow_dispatch:
    inputs:
      input_environment:
        description: 'Input environment'
        required: true
        type: choice
        options:
        - dev
        - stag
        - prod

permissions: {}

jobs:
  ec2:
    uses: ./.github/workflows/terraform-stack.yml
    permissions:
      contents: read
      id-token: write
    with:
      input_environment: ${{ inputs.input_environment }}
      input_stack: ec2
      input_mode: destroy
  vpc:
    needs: ec2
    uses: ./.github/workflows/terraform-stack.yml
    permissions:
      contents: read
      id-token: write
    with:
      input_environment: ${{ inputs.input_environment }}
      input_stack: vpc
      input_mode: destroy
